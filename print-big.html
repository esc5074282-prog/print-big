<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>พิมพ์ข้อความ Chekhoff</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&family=Noto+Sans+Thai:wght@400;700&display=swap">
<style>
  :root{color-scheme:dark;--card:rgba(17,20,26,.86);--ink:#f3f4f6;--mute:#9ca3af;--line:#3a414d;--accent:#2dd4bf;--accentInk:#04201c;--bad:#f87171}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#000;color:var(--ink);font:16px/1.4 "Noto Sans Thai",system-ui,sans-serif;padding:12px;max-width:560px;margin-inline:auto;min-height:100vh}
  #bg{position:fixed;inset:0;z-index:-1;pointer-events:none}
  #logo{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:min(100vw,640px);opacity:.5}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
  label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
  label.first{margin-top:0}
  input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:8px;padding:10px}
  textarea{min-height:120px;resize:vertical}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chk{display:flex;gap:8px;align-items:center;margin:12px 12px 0 0;color:var(--ink);font-size:16px}
  .chk input{width:20px;height:20px;accent-color:var(--accent)}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{flex:1;border:0;background:transparent;color:var(--ink);padding:10px;font:inherit}
  .seg button.on{background:var(--accent);color:var(--accentInk);font-weight:700}
  .btn2{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;padding:10px;font:inherit;width:100%;margin-top:10px}
  .ipbar{display:flex;gap:8px}
  .ipbar input{flex:1}
  .ipbar button{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;padding:0 12px;font:inherit;white-space:nowrap}
  #found{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  #found button{border:1px solid var(--accent);background:transparent;color:var(--ink);border-radius:999px;padding:8px 12px;font:inherit;font-size:14px}
  button.go{width:100%;padding:16px;border:0;border-radius:10px;background:var(--accent);color:var(--accentInk);font:inherit;font-weight:700;font-size:18px}
  button.go:disabled{opacity:.5}
  #msg,#warn,#scanmsg{min-height:20px;margin-top:8px;font-size:14px;color:var(--mute)}
  #msg.err,#warn{color:var(--bad)}
  .hint{font-size:13px;color:var(--mute);margin:6px 0 0}
  details>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
  details>summary::-webkit-details-marker{display:none}
  details>summary::after{content:"● เปิดอยู่ · กดเพื่อซ่อน";background:var(--accent);color:var(--accentInk);padding:6px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
  details:not([open])>summary::after{content:"○ ซ่อนอยู่ · กดเพื่อแสดง";background:transparent;color:var(--accent);border:1px solid var(--accent)}
  #sum{font-weight:400;font-size:13px;color:var(--mute);flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  details[open] #sum{display:none}
  .setbody{margin-top:8px}
  #landBox{display:none}
  .paper{background:#fff;border:1px solid var(--line);overflow:auto;max-height:380px;border-radius:6px}
  canvas{display:block;width:100%;height:auto}
</style>
</head>

<button class="go" id="print">พิมพ์</button>
<button class="btn2" id="test">ทดสอบพิมพ์</button>
<div id="msg"></div>

<script>
const W = 576;                       // 80mm paper: 72mm printable = 576 dots
const FONT = '"Kanit","Noto Sans Thai",sans-serif';
const RU = /[\u0400-\u04FF]/;
const QTY = /(?<![№\w])(\d+)(?=\s+\d+(?:\.\d+)?\.-?(?:\s|$))/;
const DELIV = /orderType\s*=\s*delivery/i;
const TOP_ROW = 30;                  // space for the time at the top right
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d', {willReadFrequently:true});
const off = document.createElement('canvas'), oc = off.getContext('2d', {willReadFrequently:true});
const LOGO = $('logo');

// ---------- state ----------
// Remembered across visits: IP, paper layout, panel open/closed.
// Reset on every visit: text, font size (30), Russian cleaning (on), copies (2).
let S = {orient:'port', rot:'cw', len:30, size:30, align:'center', border:false, invert:false, deliv:false, clean:true, copies:2, grab:false, grabPrice:'', pay:'', payOn:false, sendOn:false, sendTo:''};

function loadState(){
  try {
    const j = JSON.parse(localStorage.getItem('tmprint3') || '{}');
    if (j.S) ['orient','rot','len','align','border','invert'].forEach(k => { if (j.S[k] !== undefined) S[k] = j.S[k]; });
    if (j.ip) $('ip').value = j.ip;
    if (j.open === false) $('set').open = false;
    if (j.xopen === true) $('extra').open = true;
  } catch(e){}
  S.size = 30; S.clean = true; S.copies = 2;
}
function saveState(){
  try {
    const keep = {orient:S.orient, rot:S.rot, len:S.len, align:S.align, border:S.border, invert:S.invert};
    localStorage.setItem('tmprint3', JSON.stringify({S:keep, ip:$('ip').value, open:$('set').open, xopen:$('extra').open}));
  } catch(e){}
}

// ---------- order text ----------
function cleanOrder(raw){
  let text = raw.replace(/\r/g, '');
  const parts = text.split(/\n[ \t]*-{5,}[ \t]*(?:\n|$)/);
  if (parts.length > 1) {
    const en = parts.filter(p => /[A-Za-z]/.test(p) && !RU.test(p));
    if (en.length) text = en.join('\n');
  }
  const out = [];
  for (const line of text.split('\n')) {
    if (RU.test(line)) continue;
    const indented = /^[ \t]/.test(line);
    const l = line.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\uFE0F]/gu, '').replace(/\*/g, '').trim();
    if (!l || !/[A-Za-z]/.test(l)) continue;
    out.push(indented ? '   ' + l : (/^(ordertype|total)/i.test(l) ? l : '🟢 ' + l));
  }
  const res = [];
  out.forEach((l, i) => { if (i > 0 && !/^\s/.test(l)) res.push(''); res.push(l); });
  return res.join('\n');
}

function segs(str){
  if (window.Intl && Intl.Segmenter) return [...new Intl.Segmenter('th', {granularity:'word'}).segment(str)].map(s => s.segment);
  return [...str];
}
function wrap(text, maxW){
  const lines = [];
  for (const para of text.split('\n')) {
    if (para === '') { lines.push(''); continue; }
    let cur = '';
    for (const seg of segs(para)) {
      if (oc.measureText(cur + seg).width <= maxW) { cur += seg; continue; }
      if (cur.trim()) lines.push(cur.trimEnd());
      cur = '';
      let piece = '';
      for (const ch of [...seg.trimStart()]) {
        if (oc.measureText(piece + ch).width > maxW && piece) { lines.push(piece); piece = ''; }
        piece += ch;
      }
      cur = piece;
    }
    lines.push(cur.trimEnd());
  }
  return lines;
}

// ---------- order text ----------
function fmtNum(n){ return String(Math.round(n * 100) / 100); }
// Text as it will print: adds the Grab price into the total and appends the payment method.
// The text box itself is not changed.
function displayText(raw){
  if (!raw.trim()) return '';
  const lines = raw.split('\n').filter(l => !/ordertype/i.test(l));
  const gp = parseFloat(String(S.grabPrice).replace(/,/g, ''));
  if (S.grab && isFinite(gp) && gp > 0) {
    const ti = lines.findIndex(l => /total/i.test(l) && /\d/.test(l));
    const idx = ti >= 0 ? lines[ti].search(/total/i) : -1;
    const nm = idx >= 0 ? /(\d+(?:\.\d+)?)/.exec(lines[ti].slice(idx)) : null;
    if (nm) {
      lines[ti] = lines[ti].slice(0, idx) + 'Total = ' + fmtNum(parseFloat(nm[1]) + gp) + '.-';
      lines.splice(ti, 0, 'Grab = ' + fmtNum(gp) + '.-');
    } else {
      lines.push('Grab = ' + fmtNum(gp) + '.-');
    }
  }
  if (S.sendOn && S.sendTo.trim()) lines.push('Deliver to = ' + S.sendTo.trim());
  if (S.payOn && S.pay) lines.push('Pay by = ' + S.pay);
  return lines.join('\n');
}
function resetOrder(){ $('txt').value = ''; S.deliv = false; S.grab = false; S.grabPrice = ''; S.pay = ''; S.payOn = false; S.sendOn = false; S.sendTo = ''; }

// ---------- rendering ----------
const fontOf = (size, bold) => (bold ? 'bold ' : '') + size + 'px ' + FONT;
const clamp = v => Math.max(20, Math.min(400, v));
function nowTime(){
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return p(d.getHours()) + ':' + p(d.getMinutes());
}
function deliverySize(LW){
  oc.font = fontOf(100, true);
  return Math.max(20, Math.floor(100 * LW / oc.measureText('DELIVERY').width));
}
// Two short lines under the quantity of an order line (only when Russian cleaning is on)
function underlineQty(l, x, y){
  const m = QTY.exec(l); if (!m) return;
  const full = oc.measureText(l).width;
  const x0 = oc.textAlign === 'center' ? x - full/2 : oc.textAlign === 'right' ? x - full : x;
  const sx = x0 + oc.measureText(l.slice(0, m.index)).width;
  const qw = oc.measureText(m[1]).width;
  const th = Math.max(2, Math.round(S.size / 16));
  const uy = y + S.size * 0.42;
  oc.fillRect(sx, uy, qw, th);
  oc.fillRect(sx, uy + th + 3, qw, th);
}

function render(override){
  const land = S.orient === 'land';
  const pad = S.border ? 20 : 0;
  const lh = Math.round(S.size * 1.3);
  const boxW = land ? Math.round(S.len * 80) : W;
  oc.font = fontOf(S.size, true);
  const lines = wrap(override !== undefined ? override : displayText($('txt').value), boxW - 2*pad - 16);
  const total = lines.length * lh;

  const LW = Math.min(320, boxW - 2*pad - 40);
  const logoH = (LOGO.complete && LOGO.naturalWidth) ? Math.round(LW * LOGO.naturalHeight / LOGO.naturalWidth) : 0;
  const top = TOP_ROW + logoH;
  const dSize = S.deliv ? deliverySize(LW) : 0;
  const dH = S.deliv ? dSize + 150 : 0;               // room for DELIVERY + a space below for notes
  const H = land ? W : Math.max(lh, top + total + dH + 2*pad + 16);

  $('warn').textContent = (land && total > W - 2*pad - 8)
    ? 'ข้อความสูงเกินความกว้างกระดาษ ลดขนาดตัวอักษรหรือกด "ขยายให้พอดีกระดาษ"' : '';

  off.width = boxW; off.height = H;
  const fg = S.invert ? '#fff' : '#000', bg = S.invert ? '#000' : '#fff';
  oc.fillStyle = bg; oc.fillRect(0, 0, boxW, H);
  oc.fillStyle = fg;
  if (S.border) { oc.strokeStyle = fg; oc.lineWidth = 6; oc.strokeRect(5, 5, boxW - 10, H - 10); }

  // time, top right
  oc.font = fontOf(22, false); oc.textBaseline = 'middle'; oc.textAlign = 'right';
  oc.fillText('Time : ' + nowTime(), boxW - pad - 8, pad + 8 + TOP_ROW/2);

  // logo, top centre (printed dark on light paper)
  if (logoH) {
    oc.save(); oc.filter = S.invert ? 'none' : 'invert(1)';
    oc.drawImage(LOGO, (boxW - LW)/2, pad + 8 + TOP_ROW, LW, logoH);
    oc.restore();
  }

  // DELIVERY, bottom centre
  if (S.deliv) {
    oc.font = fontOf(dSize, true); oc.textAlign = 'center';
    oc.fillText('DELIVERY', boxW/2, H - 120 - pad - 8 - dSize/2);
  }

  // order text
  oc.font = fontOf(S.size, true); oc.textBaseline = 'middle'; oc.textAlign = S.align;
  const x = S.align === 'center' ? boxW/2 : S.align === 'right' ? boxW - pad - 8 : pad + 8;
  const y0 = land ? top + (H - top - dH - total)/2 : top + pad + 8;
  lines.forEach((l, i) => {
    const y = y0 + i*lh + lh/2;
    oc.fillText(l, x, y);
    if (S.clean) underlineQty(l, x, y);
  });

  // output to the printer-size canvas (rotated for landscape)
  if (land) {
    cv.width = W; cv.height = boxW;
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, boxW);
    if (S.rot === 'cw') { ctx.translate(W, 0); ctx.rotate(Math.PI/2); }
    else { ctx.translate(0, boxW); ctx.rotate(-Math.PI/2); }
    ctx.drawImage(off, 0, 0);
    ctx.setTransform(1,0,0,1,0,0);
  } else {
    cv.width = W; cv.height = H;
    ctx.drawImage(off, 0, 0);
  }
  const img = ctx.getImageData(0, 0, cv.width, cv.height), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = (d[i]*0.3 + d[i+1]*0.59 + d[i+2]*0.11) < 150 ? 0 : 255;
    d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return img;
}

function fit(){
  const raw = $('txt').value.split('\n'), n = Math.max(1, raw.length), pad = S.border ? 20 : 0;
  oc.font = fontOf(100, true);
  const w100 = Math.max(1, ...raw.map(l => oc.measureText(l).width));
  if (S.orient === 'land') {
    S.size = clamp(Math.floor((W - 2*pad - 16) / (n * 1.3)));
    S.len = Math.max(5, Math.min(60, Math.ceil((w100 * S.size/100 + 2*pad + 32) / 80)));
  } else {
    S.size = clamp(Math.floor(100 * (W - 2*pad - 16) / w100));
  }
  update();
}

// ---------- UI ----------
function seg(id, v){ document.querySelectorAll('#'+id+' button').forEach(b => b.classList.toggle('on', b.dataset.v === String(v))); }
function syncUI(){
  $('sz').value = S.size; $('szv').textContent = S.size;
  $('ln').value = S.len; $('lnv').textContent = S.len;
  $('border').checked = S.border; $('invert').checked = S.invert; $('deliv').checked = S.deliv;
  $('grab').checked = S.grab; $('grabBox').style.display = S.grab ? 'block' : 'none';
  if ($('grabPrice').value !== S.grabPrice) $('grabPrice').value = S.grabPrice;
  $('payOn').checked = S.payOn; $('payBox').style.display = S.payOn ? 'block' : 'none';
  $('sendOn').checked = S.sendOn; $('sendBox').style.display = S.sendOn ? 'block' : 'none';
  if ($('sendTo').value !== S.sendTo) $('sendTo').value = S.sendTo;
  seg('pay', S.pay);
  seg('or', S.orient); seg('al', S.align); seg('rt', S.rot); seg('cp', S.copies); seg('cl', S.clean ? 'on' : 'off');
  $('landBox').style.display = S.orient === 'land' ? 'block' : 'none';
  const al = {left:'ซ้าย', center:'กลาง', right:'ขวา'}[S.align];
  $('sum').textContent = (S.orient === 'land' ? 'แนวนอน ' + S.len + 'ซม.' : 'แนวตั้ง') + ' · ' + S.size + 'px · ' + al +
    (S.border ? ' · กรอบ' : '') + (S.invert ? ' · พื้นดำ' : '');
}
function update(){ syncUI(); render(); saveState(); }
function msg(t, err){ const m = $('msg'); m.textContent = t; m.className = err ? 'err' : ''; }

// ---------- printing (ePOS-Print over the local network) ----------
const EPOS = ip => 'http://' + ip + '/cgi-bin/epos/service.cgi?devid=local_printer&timeout=20000';
const ENV = body => '<?xml version="1.0" encoding="utf-8"?><s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/"><s:Body>' +
  '<epos-print xmlns="http://www.epson-pos.com/schemas/2011/03/epos-print">' + body + '</epos-print></s:Body></s:Envelope>';
const HDR = {'Content-Type':'text/xml; charset=utf-8','If-Modified-Since':'Thu, 01 Jan 1970 00:00:00 GMT','SOAPAction':'""'};
function b64(u8){
  let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}

async function doPrint(test){
  const ip = $('ip').value.trim();
  if (!ip) return msg('ใส่ IP หรือกด "ค้นหาอัตโนมัติ" ก่อน', true);
  if (!test && !$('txt').value.trim()) return msg('ยังไม่ได้พิมพ์ข้อความ', true);
  saveState();
  const img = test ? render('ทดสอบการพิมพ์\nTEST PRINT') : render();
  const BAND = 600; let bands = '';
  for (let y = 0; y < img.height; y += BAND) {
    const h = Math.min(BAND, img.height - y);
    const part = new Uint8Array(img.data.buffer, y * img.width * 4, h * img.width * 4);
    bands += '<image width="' + img.width + '" height="' + h + '" color="color_1" mode="mono">' + b64(part) + '</image>';
  }
  const one = bands + '<feed line="3"/><cut type="feed"/>';
  const xml = ENV(one.repeat(S.copies || 1));
  const btn = $('print'); btn.disabled = true; msg('กำลังส่งไปเครื่องพิมพ์…');
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 30000);
  try {
    const r = await fetch(EPOS(ip), {method:'POST', headers:HDR, body:xml, signal:ctl.signal});
    const txt = await r.text();
    if (/success="true"/.test(txt)) {
      if (test) msg('ทดสอบพิมพ์แล้ว ✓');
      else { msg('พิมพ์แล้ว ✓'); resetOrder(); }
      update();
    } else {
      msg('เครื่องตอบกลับแต่พิมพ์ไม่สำเร็จ: ' + (txt.match(/code="([^"]*)"/) || [,''])[1], true);
    }
  } catch (e) {
    msg('ติดต่อเครื่องพิมพ์ไม่ได้ ลองกด "ค้นหาอัตโนมัติ" ตรวจว่ามือถืออยู่ Wi-Fi เดียวกัน และเปิดไฟล์นี้จากเครื่อง (ไม่ใช่ลิงก์ https) — ' + e.message, true);
  } finally { clearTimeout(t); btn.disabled = false; }
}

// ---------- finding the printer on the Wi-Fi ----------
let scanning = false, stopFlag = false;
async function probe(ip, ms){
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  try { await fetch('http://' + ip + '/', {mode:'no-cors', cache:'no-store', signal:c.signal}); return true; }
  catch(e){ return false; } finally { clearTimeout(t); }
}
async function isEpson(ip){
  const c = new AbortController(), t = setTimeout(() => c.abort(), 3000);
  try {
    const r = await fetch(EPOS(ip), {method:'POST', headers:HDR, body:ENV('<text/>'), signal:c.signal});
    return /<response/.test(await r.text());
  } catch(e){ return false; } finally { clearTimeout(t); }
}
function localPrefix(){
  return new Promise(res => {
    let done = false; const fin = v => { if (!done) { done = true; res(v); } };
    try {
      const pc = new RTCPeerConnection({iceServers:[]});
      pc.createDataChannel('');
      pc.onicecandidate = e => {
        if (!e.candidate) { pc.close(); return fin(null); }
        const m = e.candidate.candidate.match(/\b(192\.168\.\d+|10\.\d+\.\d+|172\.(?:1[6-9]|2\d|3[01])\.\d+)\.\d+\b/);
        if (m) { pc.close(); fin(m[1]); }
      };
      pc.createOffer().then(o => pc.setLocalDescription(o)).catch(() => fin(null));
      setTimeout(() => fin(null), 1500);
    } catch(e){ fin(null); }
  });
}
async function scan(){
  if (scanning) { stopFlag = true; return; }
  scanning = true; stopFlag = false;
  const btn = $('scan'), box = $('found'), sm = $('scanmsg');
  btn.textContent = 'หยุดค้นหา'; box.innerHTML = ''; sm.textContent = 'กำลังเตรียมค้นหา…';
  const lp = await localPrefix();
  const prefixes = [...new Set([lp, '192.168.1', '192.168.0', '192.168.100', '192.168.2', '10.0.0', '10.1.1'].filter(Boolean))];
  const total = prefixes.length * 254; let scanned = 0;
  const found = [];
  for (const p of prefixes) {
    if (stopFlag) break;
    const alive = []; let next = 1;
    await Promise.all(Array.from({length:48}, async () => {
      while (next <= 254 && !stopFlag) {
        const ip = p + '.' + (next++);
        if (await probe(ip, 800)) alive.push(ip);
        sm.textContent = 'กำลังค้นหา ' + ip + '  (' + (++scanned) + '/' + total + ')';
      }
    }));
    for (const ip of alive) {
      if (stopFlag) break;
      if (await isEpson(ip)) {
        found.push(ip);
        const b = document.createElement('button'); b.textContent = ip;
        b.onclick = () => { $('ip').value = ip; saveState(); sm.textContent = 'ใช้ ' + ip + ' แล้ว'; };
        box.appendChild(b);
      }
    }
    if (found.length) break;
  }
  if (found.length) {
    $('ip').value = found[0]; saveState();
    sm.textContent = found.length === 1 ? 'เจอเครื่องพิมพ์ ' + found[0] + ' ใส่ให้แล้ว ✓' : 'เจอ ' + found.length + ' เครื่อง ใส่เครื่องแรกให้แล้ว แตะเพื่อเปลี่ยน';
  } else {
    sm.textContent = stopFlag ? 'หยุดค้นหาแล้ว' : 'ไม่พบเครื่องพิมพ์ ตรวจว่าเปิดเครื่องและอยู่ Wi-Fi เดียวกัน หรือเปิด ePOS-Print ในตั้งค่าเครื่อง แล้วใส่ IP เอง';
  }
  btn.textContent = 'ค้นหาอัตโนมัติ'; scanning = false;
}

// ---------- wiring ----------
function bindSeg(id, set){
  document.querySelectorAll('#'+id+' button').forEach(b => b.onclick = () => { set(b.dataset.v); update(); });
}
bindSeg('or', v => S.orient = v);
bindSeg('al', v => S.align = v);
bindSeg('rt', v => S.rot = v);
bindSeg('cp', v => S.copies = +v);
bindSeg('cl', v => {
  S.clean = v === 'on';
  if (S.clean) S.copies = 2;
  msg(S.clean ? 'เปิดตัดภาษารัสเซียแล้ว' : 'ปิดแล้ว ข้อความจะถูกวางตามที่คัดลอกมาเลย');
});
[['border','border'], ['invert','invert'], ['deliv','deliv']].forEach(([id, k]) => {
  $(id).onchange = () => { S[k] = $(id).checked; update(); };
});
$('sz').oninput = () => { S.size = +$('sz').value; update(); };
$('ln').oninput = () => { S.len = +$('ln').value; update(); };
$('txt').addEventListener('input', () => { S.deliv = DELIV.test($('txt').value); update(); });
$('txt').addEventListener('paste', e => {
  const t = (e.clipboardData || window.clipboardData).getData('text');
  S.size = 30;
  if (S.clean && RU.test(t)) {
    e.preventDefault();
    $('txt').value = cleanOrder(t); S.copies = 2; S.deliv = DELIV.test($('txt').value);
    update(); msg('วางออเดอร์แล้ว ตัดรัสเซียออกให้แล้ว ✓');
  } else {
    update();
  }
});
$('clear').onclick = () => { resetOrder(); update(); msg('ล้างข้อความแล้ว'); };
$('grab').onchange = () => { S.grab = $('grab').checked; update(); };
$('grabPrice').oninput = () => { S.grabPrice = $('grabPrice').value; update(); };
bindSeg('pay', v => S.pay = v);
$('payOn').onchange = () => { S.payOn = $('payOn').checked; update(); };
$('sendOn').onchange = () => { S.sendOn = $('sendOn').checked; update(); };
$('sendTo').oninput = () => { S.sendTo = $('sendTo').value; update(); };
$('fit').onclick = fit;
$('scan').onclick = scan;
$('print').onclick = () => doPrint(false);
$('test').onclick = () => doPrint(true);
$('set').addEventListener('toggle', saveState);
$('extra').addEventListener('toggle', saveState);
$('ip').addEventListener('input', saveState);

loadState();
update();
LOGO.addEventListener('load', render);
if (document.fonts) {
  document.fonts.load('30px Kanit').then(render).catch(() => {});
  document.fonts.ready.then(render);
}
if (!$('ip').value.trim()) scan();
</script>
</body>
</html>
